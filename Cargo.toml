[workspace]
resolver = "2"
members = ["crates/owui"]
default-members = ["crates/owui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
authors = ["Yamrc <yamrci@outlook.com>"]
license = "MPL-2.0"

[workspace.dependencies]
bitflags = "=2.13.2"
slotmap = "=1.1.1"
thiserror = "=2.0.21"

[profile.dev]
incremental = true
codegen-units = 16
debug = 1
split-debuginfo = "unpacked"

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release-fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
debug = 1
